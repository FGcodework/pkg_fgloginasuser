COM_FGLOGINASUSER_CONFIG_BTN_ADMIN_LABEL="Text tlačítka administrace"
COM_FGLOGINASUSER_CONFIG_BTN_ADMIN_DESC="Text tlačítka pro přihlášení do administrace. %s se nahradí uživatelským jménem. Ponechte prázdné pro výchozí text."
COM_FGLOGINASUSER_CONFIG_NEWTAB_LABEL="Otevřít frontend na nové kartě"
COM_FGLOGINASUSER_CONFIG_NEWTAB_DESC="Relace frontendu je oddělená od relace administrace, takže nová karta ponechá administrátorskou obrazovku otevřenou. Přihlášení do administrace vždy probíhá na aktuální kartě, protože přepíná právě tuto relaci."
COM_FGLOGINASUSER_CONFIG_SITE_MENUITEM_LABEL="Přesměrování frontendu: položka menu"
COM_FGLOGINASUSER_CONFIG_SITE_MENUITEM_DESC="Položka menu zobrazená po přihlášení do frontendu. Má přednost před URL níže."
COM_FGLOGINASUSER_CONFIG_SITE_URL_LABEL="Přesměrování frontendu: URL"
COM_FGLOGINASUSER_CONFIG_SITE_URL_DESC="Interní URL zobrazená po přihlášení do frontendu, pokud není nastavena položka menu. Prázdné znamená úvodní stránku."
COM_FGLOGINASUSER_CONFIG_ADMIN_URL_LABEL="Přesměrování administrace: URL"
COM_FGLOGINASUSER_CONFIG_ADMIN_URL_DESC="URL administrace (například index.php?option=com_content) zobrazená po přepnutí relace administrace. Prázdné znamená nástěnku."
COM_FGLOGINASUSER_CONFIG_CSS_LABEL="Vlastní CSS pro tlačítka"
COM_FGLOGINASUSER_CONFIG_CSS_DESC="CSS použité na obrazovce Uživatelé, například .fg-las-btn { font-weight: bold; }"
COM_FGLOGINASUSER_CONFIG_SECURITY="Zabezpečení"
COM_FGLOGINASUSER_CONFIG_SECURITY_DESC="Jako koho se lze přihlásit a jak dlouho platí přihlašovací odkaz."
COM_FGLOGINASUSER_CONFIG_TTL_LABEL="Platnost přihlašovacího odkazu (sekundy)"
COM_FGLOGINASUSER_CONFIG_TTL_DESC="Jednorázový přihlašovací odkaz do frontendu přestane fungovat po této době a po prvním použití."
COM_FGLOGINASUSER_CONFIG_BINDIP_LABEL="Vázat přihlašovací odkaz na IP adresu"
COM_FGLOGINASUSER_CONFIG_BINDIP_DESC="Přihlášení do frontendu funguje jen z IP adresy, která jej vytvořila. Vypněte, pokud vaše připojení přepíná mezi IPv4 a IPv6."
COM_FGLOGINASUSER_CONFIG_SUPERUSERS_LABEL="Povolit přihlášení jako Super uživatel"
COM_FGLOGINASUSER_CONFIG_SUPERUSERS_DESC="Ve výchozím stavu vypnuto. Je-li zapnuto, smí se Super uživatel přihlásit jako jiný Super uživatel."
COM_FGLOGINASUSER_CONFIG_RESTRICTIONS_LABEL="Omezení podle skupiny administrátorů"
COM_FGLOGINASUSER_CONFIG_RESTRICTIONS_DESC="Omezte, jako které uživatele se smějí přihlašovat členové skupiny. Administrátoři, jejichž skupiny zde nemají řádek, nejsou omezeni; řádek bez cílových skupin neumožní nikoho. Platí-li pro jednoho administrátora více řádků (vlastní a zděděné skupiny), jejich cílové skupiny se sloučí (sjednocení). Super uživatelé nejsou nikdy omezeni."
COM_FGLOGINASUSER_CONFIG_RESTR_ACTOR="Skupina administrátorů"
COM_FGLOGINASUSER_CONFIG_RESTR_TARGETS="Smí se přihlásit jako členové skupin"
COM_FGLOGINASUSER_CONFIG_LOGGING="Log a oznámení"
COM_FGLOGINASUSER_CONFIG_LOGGING_DESC="Uchovávání auditního logu a e-mailová oznámení."
COM_FGLOGINASUSER_CONFIG_RETENTION_LABEL="Uchovávat záznamy logu (dny)"
COM_FGLOGINASUSER_CONFIG_RETENTION_DESC="Starší záznamy se odstraňují automaticky. 0 je uchovává navždy."
COM_FGLOGINASUSER_CONFIG_NOTIFY_LABEL="E-mailové oznámení"
COM_FGLOGINASUSER_CONFIG_NOTIFY_DESC="Odešle e-mail pokaždé, když se někdo přihlásí jako jiný uživatel. Používá nastavení pošty Joomly (SMTP funguje i na hostingu bez PHP mail)."
COM_FGLOGINASUSER_CONFIG_NOTIFY_EMAIL_LABEL="E-mailová adresa pro oznámení"
COM_FGLOGINASUSER_CONFIG_NOTIFY_EMAIL_DESC="Ponechte prázdné pro použití adresy odesílatele z Globální konfigurace."
COM_FGLOGINASUSER_ERR_SHARED_SESSION="Web používá jednu relaci pro frontend i administraci (Globální konfigurace -> Systém -> Sdílená relace). Přihlášení jako jiný uživatel je při sdílených relacích zakázáno, protože by se identita jiného uživatele uplatnila i ve vaší administraci."
COM_FGLOGINASUSER_ERR_NO_BAR="Plugin Systém - FG Login as User je vypnutý. Zobrazuje lištu, která umožňuje vrátit se na vlastní účet, proto je přihlášení jako jiný uživatel blokováno, dokud nebude zapnut."
COM_FGLOGINASUSER_ERR_RESET="Tento uživatel musí při příštím přihlášení změnit heslo. Joomla by relaci poslala na formulář pro změnu hesla a zablokovala cestu zpět, proto přihlášení jako tento uživatel není možné."
COM_FGLOGINASUSER_ERR_SESSION="Relaci se nepodařilo obnovit, nic se proto nezměnilo."
COM_FGLOGINASUSER_ERR_TOKEN_IP="Token použit z jiné IP adresy: %s"
COM_FGLOGINASUSER_NOTE_REPLACED="Nahrazeno novým přihlášením jako jiný uživatel ve stejné relaci prohlížeče."
COM_FGLOGINASUSER_LOGS_PURGE_CONFIRM="Smazat dokončené záznamy logu? Nepoužité přihlašovací odkazy, jejichž platnost ještě nevypršela, a přihlášení z posledního dne zůstanou zachovány."
COM_FGLOGINASUSER_ACTION_LOGS="Zobrazit a mazat auditní log"
COM_FGLOGINASUSER_ACTION_LOGS_DESC="Umožňuje otevřít auditní log této komponenty (IP adresy, kdo se přihlásil jako kdo) a mazat jeho záznamy. Používání přihlašovacích tlačítek jej nevyžaduje."
COM_FGLOGINASUSER_CONFIG_RESTR_DEFAULT_LABEL="Administrátoři bez omezení"
COM_FGLOGINASUSER_CONFIG_RESTR_DEFAULT_DESC="Co se stane, když se na administrátora nevztahuje žádné omezení níže (včetně skupin zděděných z nadřazených skupin). Povolit = jakýkoli cíl, který smí jinak použít; Zakázat = nikdo, takže každá skupina administrátorů potřebuje řádek. Super uživatelé nejsou nikdy omezeni."
