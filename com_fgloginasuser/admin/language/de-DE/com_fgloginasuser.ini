COM_FGLOGINASUSER_ERR_REASON_INVALID="Dieser Grund steht nicht in der Liste der erlaubten Gründe."
COM_FGLOGINASUSER_CONFIG_PRESETS_LABEL="Vordefinierte Gründe"
COM_FGLOGINASUSER_CONFIG_PRESETS_DESC="Gründe, die in einer Dropdown-Liste angeboten werden. Leer lassen für einen reinen Freitext-Grund. Die Protokollansicht erhält einen Filter nach diesen Gründen."
COM_FGLOGINASUSER_CONFIG_PRESET_ITEM="Grund"
COM_FGLOGINASUSER_CONFIG_REASON_OTHER_LABEL="Andere Gründe erlauben"
COM_FGLOGINASUSER_CONFIG_REASON_OTHER_DESC="Fügt den Eintrag Anderer... hinzu, bei dem die Person ihren eigenen Grund schreibt. Wenn aus, werden nur die vordefinierten Gründe akzeptiert."
COM_FGLOGINASUSER_FILTER_REASON="- Grund wählen -"
COM_FGLOGINASUSER_FILTER_REASON_NONE="(kein Grund angegeben)"
COM_FGLOGINASUSER_DIALOG_STEPUP_PASSWORD="Bestätigen Sie Ihr Passwort"
COM_FGLOGINASUSER_DIALOG_STEPUP_CODE="Code Ihres zweiten Faktors (Authenticator-App)"
COM_FGLOGINASUSER_ERR_STEPUP_REQUIRED="Bestätigen Sie Ihr Passwort (und den Code des zweiten Faktors, falls Sie einen verwenden), um sich als anderer Benutzer anzumelden."
COM_FGLOGINASUSER_ERR_STEPUP_PASSWORD="Das Passwort ist nicht korrekt."
COM_FGLOGINASUSER_ERR_STEPUP_CODE="Der Code des zweiten Faktors ist nicht korrekt."
COM_FGLOGINASUSER_ERR_STEPUP_LOCKED="Zu viele falsche Versuche. Versuchen Sie es in 15 Minuten erneut."
COM_FGLOGINASUSER_CONFIG_STEPUP_LABEL="Identität vor der Anmeldung als anderer Benutzer bestätigen"
COM_FGLOGINASUSER_CONFIG_STEPUP_DESC="Fragt den Administrator im Dialog nach seinem eigenen Passwort (und optional nach einem Code des zweiten Faktors), sodass eine gestohlene oder offen gelassene Administrator-Sitzung nicht ausreicht. Zweite Faktoren, die den Browser benötigen oder den Code auf Anforderung senden (WebAuthn, E-Mail), können hier nicht abgefragt werden: Ein Konto, das nur solche hat, wird nur nach dem Passwort gefragt."
COM_FGLOGINASUSER_CONFIG_STEPUP_OFF="Aus"
COM_FGLOGINASUSER_CONFIG_STEPUP_PASSWORD="Passwort"
COM_FGLOGINASUSER_CONFIG_STEPUP_MFA="Passwort und Code des zweiten Faktors"
COM_FGLOGINASUSER_CONFIG_STEPUP_MIN_LABEL="Bestätigung gültig für (Minuten)"
COM_FGLOGINASUSER_CONFIG_STEPUP_MIN_DESC="Nach einer erfolgreichen Bestätigung wird der Administrator so lange nicht erneut gefragt."
COM_FGLOGINASUSER_ERR_TOO_MANY="Zu viele unbenutzte Anmeldelinks warten. Verwenden Sie einen oder warten Sie, bis er abläuft."
COM_FGLOGINASUSER_CONFIG_MAXPENDING_LABEL="Höchstzahl unbenutzter Anmeldelinks pro Administrator"
COM_FGLOGINASUSER_CONFIG_MAXPENDING_DESC="Frontend-Anmeldungen, die gestartet, aber noch nicht geöffnet wurden. Weitere Versuche werden verweigert, bis einer verwendet wird oder abläuft."
COM_FGLOGINASUSER_CONFIGURATION="FG Login as User: Optionen"
COM_FGLOGINASUSER_ERR_HIGHER="Dieser Benutzer hat globale Berechtigungen, die Sie nicht haben."
COM_FGLOGINASUSER_CONFIG_HIGHER_LABEL="Anmeldung als Benutzer mit höheren Rechten nicht erlauben"
COM_FGLOGINASUSER_CONFIG_HIGHER_DESC="Ein Administrator kann sich nicht als Benutzer anmelden, der eine globale Berechtigung (Zugriff auf die Administration, Erstellen, Löschen, Bearbeiten, Status bearbeiten, Eigene bearbeiten) besitzt, die dem Administrator fehlt, sonst könnte jeder mit der Anmelde-Berechtigung stärkere Konten übernehmen. Super-Benutzer sind von dieser Regel nicht betroffen. Berechtigungen innerhalb einzelner Komponenten werden nicht verglichen; dafür verwenden Sie die Gruppenbeschränkungen unten."
COM_FGLOGINASUSER_CONFIG_SCOPE_NOTE_LABEL="Als wer darf man sich anmelden?"
COM_FGLOGINASUSER_CONFIG_SCOPE_NOTE_DESC="Die Anmelde-Berechtigung für eine Gruppe schränkt nicht ein, als welche Benutzer sich ihre Mitglieder anmelden können. Verwenden Sie dafür die Option unten und die Gruppenbeschränkungen."
COM_FGLOGINASUSER_ERR_STEPUP_MFA_UNAVAILABLE="Der zweite Faktor Ihres Kontos konnte nicht geprüft werden, daher wurde die Anmeldung verweigert. Versuchen Sie es erneut oder wenden Sie sich an den Website-Administrator."
COM_FGLOGINASUSER_ERR_STEPUP_MFA_UNSUPPORTED="Ihr zweiter Faktor kann hier nicht abgefragt werden, daher wurde die Anmeldung verweigert."
COM_FGLOGINASUSER_CONFIG_STEPUP_UNSUP_LABEL="Konten, deren zweiter Faktor hier nicht abgefragt werden kann"
COM_FGLOGINASUSER_CONFIG_STEPUP_UNSUP_DESC="Zweite Faktoren per WebAuthn und E-Mail können im Dialog nicht abgefragt werden. Nur Passwort: Ein solches Konto wird allein durch sein Passwort bestätigt. Verweigern: Ein solches Konto kann sich nicht als anderer Benutzer anmelden, solange dieser Modus aktiv ist. Kann der zweite Faktor nicht gelesen werden, wird die Anmeldung immer verweigert."
COM_FGLOGINASUSER_CONFIG_STEPUP_UNSUP_PASSWORD="Nur Passwort"
COM_FGLOGINASUSER_CONFIG_STEPUP_UNSUP_REFUSE="Verweigern"
COM_FGLOGINASUSER_WARN_PLUGIN_OFF="Das Plugin System - FG Login as User ist deaktiviert. Die Anmeldung als anderer Benutzer wird verweigert, bis es aktiviert wird. Bereits laufende Anmeldungen verlieren die Rückkehr-Leiste und ihr Zeitlimit, und eine normale Abmeldung dort würde auch die eigenen Sitzungen des echten Benutzers beenden. Aktivieren Sie das Plugin (Plugins) oder beenden Sie diese Anmeldungen im Protokoll."
COM_FGLOGINASUSER_NOTE_SESSION_GONE="Beendet: Die Sitzung existiert nicht mehr (abgelaufen oder ohne Verwendung des Rückkehr-Links geschlossen)."
COM_FGLOGINASUSER_NOTE_SESSION_PRESUMED="Vermutlich beendet: älter als ein Tag und die Sitzung kann nicht nachgeschlagen werden."

