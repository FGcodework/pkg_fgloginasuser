COM_FGLOGINASUSER_ACTION_FRONTEND="Im Frontend als Benutzer anmelden"
COM_FGLOGINASUSER_ACTION_FRONTEND_DESC="Erlaubt die Anmeldung im Frontend als anderer Benutzer. Dies schränkt für sich genommen NICHT ein, als welche Benutzer: siehe Optionen -> Sicherheit (keine höheren Rechte, Gruppenbeschränkungen). Super-Benutzer haben dieses Recht immer. Benötigt zusätzlich die Berechtigung Zugriff auf die Administrationsoberfläche."
COM_FGLOGINASUSER_ACTION_BACKEND="Im Backend als Benutzer anmelden"
COM_FGLOGINASUSER_ACTION_BACKEND_DESC="Erlaubt das Umstellen der Backend-Sitzung auf einen anderen Benutzer, der sich im Backend anmelden darf. Dies schränkt für sich genommen NICHT ein, als welche Benutzer: siehe Optionen -> Sicherheit (keine höheren Rechte, Gruppenbeschränkungen). Super-Benutzer haben dieses Recht immer. Benötigt zusätzlich die Berechtigung Zugriff auf die Administrationsoberfläche."
