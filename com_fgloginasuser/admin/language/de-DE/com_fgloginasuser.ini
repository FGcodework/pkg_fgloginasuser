COM_FGLOGINASUSER_CONFIG_WEBHOOK_LABEL="Webhook senden"
COM_FGLOGINASUSER_CONFIG_WEBHOOK_DESC="Sendet eine kurze Nachricht an eine Webadresse, wenn eine Anmeldung als anderer Benutzer beginnt, endet oder verweigert wird. Standardmäßig aus. Enthält nie Token oder Passwörter. Ein Fehler wird nur in die Protokolldatei geschrieben und beeinflusst die Anmeldung nie; der Aufruf wartet höchstens 3 Sekunden."
COM_FGLOGINASUSER_CONFIG_WEBHOOK_URL_LABEL="Webhook-Adresse"
COM_FGLOGINASUSER_CONFIG_WEBHOOK_URL_DESC="Nur HTTPS, ohne Benutzername und Passwort in der Adresse. Weiterleitungen werden nicht verfolgt."
COM_FGLOGINASUSER_CONFIG_WEBHOOK_PRESET_LABEL="Nachrichtenformat"
COM_FGLOGINASUSER_CONFIG_WEBHOOK_PRESET_DESC="Allgemein sendet ein JSON-Objekt; Slack, Discord und Microsoft Teams senden einen einzeiligen Text in dem Format, das diese Dienste akzeptieren."
COM_FGLOGINASUSER_CONFIG_WEBHOOK_PRESET_GENERIC="Allgemeines JSON"
COM_FGLOGINASUSER_CONFIG_WEBHOOK_EVENTS_LABEL="Ereignisse"
COM_FGLOGINASUSER_CONFIG_WEBHOOK_EVENTS_DESC="Welche Ereignisse gesendet werden. Nichts ausgewählt = alle."
COM_FGLOGINASUSER_CONFIG_WEBHOOK_EVENT_STARTED="Anmeldung gestartet"
COM_FGLOGINASUSER_CONFIG_WEBHOOK_EVENT_ENDED="Anmeldung beendet"
COM_FGLOGINASUSER_CONFIG_WEBHOOK_EVENT_DENIED="Anmeldung verweigert"
COM_FGLOGINASUSER_CONFIG_WEBHOOK_SECRET_LABEL="Signatur-Geheimnis"
COM_FGLOGINASUSER_CONFIG_WEBHOOK_SECRET_DESC="Optional. Das allgemeine JSON wird mit HMAC-SHA256 signiert und im Header X-FG-Signature (sha256=...) gesendet, damit der Empfänger es prüfen kann."
