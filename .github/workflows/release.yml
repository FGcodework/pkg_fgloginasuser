name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /dev/null
          for f in $(find . -name '*.xml' -not -path './.git/*'); do python3 -c "import sys, xml.dom.minidom as m; m.parse(sys.argv[1])" "$f"; done
          for f in $(find . -name '*.ini' -not -path './.git/*'); do php -r 'if (@parse_ini_file($argv[1]) === false) { fwrite(STDERR, "Bad ini: $argv[1]\n"); exit(1); }' "$f"; done

      - name: Build
        run: bash build.sh

      - name: Check tag, manifest and update feed agree
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' pkg_fgloginasuser.xml | head -1)
          UPD=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' updates.xml | head -1)
          echo "tag=$TAG package=$PKG updates=$UPD"
          [ "$TAG" = "$PKG" ] && [ "$PKG" = "$UPD" ]
          git diff --exit-code updates.xml || { echo "updates.xml is out of date - run ./build.sh and commit it before tagging"; exit 1; }

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "FG Login as User ${GITHUB_REF_NAME#v}" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md). Install \`pkg_fgloginasuser_${GITHUB_REF_NAME}.zip\` (component + system plugin + action log plugin)."
