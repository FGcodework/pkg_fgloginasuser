COM_FGLOGINASUSER_NOTE_RETURNED="Vom Administrator mit der Rückkehr-Schaltfläche beendet."
COM_FGLOGINASUSER_NOTE_LOGOUT="Durch eine Abmeldung innerhalb der als anderer Benutzer angemeldeten Sitzung beendet."
COM_FGLOGINASUSER_NOTE_RIGHTS_LOST="Automatisch beendet: Der Administrator hat nicht mehr das Recht, sich als anderer Benutzer anzumelden."
COM_FGLOGINASUSER_CONFIG_RECHECK_LABEL="Rechte des Administrators bei jeder Anfrage erneut prüfen"
COM_FGLOGINASUSER_CONFIG_RECHECK_DESC="Solange jemand als anderer Benutzer angemeldet ist, wird bei jeder Anfrage geprüft, ob der ursprüngliche Administrator noch existiert, nicht gesperrt und aktiviert ist und weiterhin das Recht hat, sich als andere Benutzer anzumelden. Wenn nicht, endet die Anmeldung sofort (die Sitzung wird geschlossen, nicht zurückgegeben). Standardmäßig aus; es kostet während einer Anmeldung nur einige Datenbankabfragen."
