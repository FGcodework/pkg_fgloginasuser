COM_FGLOGINASUSER_CONFIG_MAXMIN_LABEL="Maximální doba (minuty)"
COM_FGLOGINASUSER_CONFIG_MAXMIN_DESC="Přihlášení jako jiný uživatel se po této době automaticky ukončí a relace se zavře. 0 = bez omezení."
COM_FGLOGINASUSER_CONFIG_REASON_LABEL="Důvod přihlášení"
COM_FGLOGINASUSER_CONFIG_REASON_DESC="Zda se administrátor ptá, proč se přihlašuje jako jiný uživatel. Důvod se uloží do logu, do protokolu akcí uživatelů, do e-mailového oznámení a zobrazí se v liště pro návrat."
