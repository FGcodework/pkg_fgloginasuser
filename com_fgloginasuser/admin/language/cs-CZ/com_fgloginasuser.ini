COM_FGLOGINASUSER_ACTION_FRONTEND="Přihlášení do frontendu jako uživatel"
COM_FGLOGINASUSER_ACTION_FRONTEND_DESC="Umožňuje přihlásit se do frontendu jako jiný uživatel. Samo o sobě neomezuje, JAKÉ uživatele: viz Volby -> Zabezpečení (žádná vyšší práva, omezení podle skupin). Super uživatelé toto právo mají vždy. Vyžaduje také oprávnění Přístup do administrace."
COM_FGLOGINASUSER_ACTION_BACKEND="Přihlášení do administrace jako uživatel"
COM_FGLOGINASUSER_ACTION_BACKEND_DESC="Umožňuje přepnout relaci administrace na jiného uživatele, který se smí přihlásit do administrace. Samo o sobě neomezuje, JAKÉ uživatele: viz Volby -> Zabezpečení (žádná vyšší práva, omezení podle skupin). Super uživatelé toto právo mají vždy. Vyžaduje také oprávnění Přístup do administrace."
