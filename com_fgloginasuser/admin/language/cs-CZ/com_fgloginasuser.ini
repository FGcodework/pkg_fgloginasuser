COM_FGLOGINASUSER_CONFIG_PRESETS_LABEL="Předdefinované důvody"
COM_FGLOGINASUSER_CONFIG_PRESETS_DESC="Důvody nabízené v rozbalovacím seznamu. Ponechte prázdné pro důvod pouze ve volném textu. Obrazovka Log získá filtr podle těchto důvodů."
