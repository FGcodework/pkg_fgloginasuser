COM_FGLOGINASUSER_CONFIG_MAXMIN_DESC="Eine Anmeldung als anderer Benutzer endet nach dieser Zeit automatisch und die Sitzung wird geschlossen. 0 = keine Begrenzung."
COM_FGLOGINASUSER_CONFIG_REASON_LABEL="Grund für die Anmeldung"
COM_FGLOGINASUSER_CONFIG_REASON_DESC="Ob der Administrator gefragt wird, warum er sich als anderer Benutzer anmeldet. Der Grund wird im Protokoll, im Benutzer-Aktionsprotokoll und in der Benachrichtigungs-E-Mail gespeichert und in der Rückkehr-Leiste angezeigt."
