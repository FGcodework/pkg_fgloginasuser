COM_FGLOGINASUSER_CONFIG_RESTR_DEFAULT_DENY="Zakázat"
COM_FGLOGINASUSER_DIALOG_TITLE_SITE="Přihlášení do frontendu jako %s"
COM_FGLOGINASUSER_DIALOG_BODY_SITE="Web se otevře na nové kartě s relací tohoto uživatele. Ukončíte ji pomocí lišty ve spodní části stránky."
