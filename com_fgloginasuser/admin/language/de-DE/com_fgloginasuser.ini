COM_FGLOGINASUSER_ERR_TARGET_NO_ADMIN="Dieser Benutzer darf sich nicht im Backend anmelden."
COM_FGLOGINASUSER_ERR_SUPERUSER="Als Super-Benutzer kann sich nur ein anderer Super-Benutzer anmelden, und nur wenn dies in den Optionen aktiviert ist."
COM_FGLOGINASUSER_ERR_RESTRICTED="Ihre Benutzergruppe darf sich nicht als Mitglied der Gruppen dieses Benutzers anmelden (siehe Beschränkungen in den Optionen)."
