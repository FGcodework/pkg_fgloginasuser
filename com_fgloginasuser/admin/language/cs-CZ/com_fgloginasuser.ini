COM_FGLOGINASUSER_ERR_STEPUP_REQUIRED="Pro přihlášení jako jiný uživatel potvrďte své heslo (a kód druhého faktoru, pokud jej používáte)."
COM_FGLOGINASUSER_ERR_STEPUP_PASSWORD="Heslo není správné."
COM_FGLOGINASUSER_ERR_STEPUP_CODE="Kód druhého faktoru není správný."
COM_FGLOGINASUSER_ERR_STEPUP_LOCKED="Příliš mnoho chybných pokusů. Zkuste to znovu za 15 minut."
COM_FGLOGINASUSER_CONFIG_STEPUP_LABEL="Potvrdit identitu před přihlášením jako jiný uživatel"
COM_FGLOGINASUSER_CONFIG_STEPUP_DESC="V dialogu se administrátora zeptá na jeho vlastní heslo (a volitelně na kód druhého faktoru), takže ukradená nebo ponechaná otevřená administrátorská relace nestačí. Druhé faktory, které vyžadují prohlížeč nebo posílají kód na vyžádání (WebAuthn, e-mail), se zde vyžádat nedají: účet, který má pouze takové, je dotázán jen na heslo."
COM_FGLOGINASUSER_CONFIG_STEPUP_OFF="Vypnuto"
COM_FGLOGINASUSER_CONFIG_STEPUP_PASSWORD="Heslo"
COM_FGLOGINASUSER_CONFIG_STEPUP_MFA="Heslo a kód druhého faktoru"
COM_FGLOGINASUSER_CONFIG_STEPUP_MIN_LABEL="Potvrzení platí (minuty)"
COM_FGLOGINASUSER_CONFIG_STEPUP_MIN_DESC="Po úspěšném potvrzení se administrátor po tuto dobu znovu neptá."
COM_FGLOGINASUSER_ERR_TOO_MANY="Čeká příliš mnoho nepoužitých přihlašovacích odkazů. Použijte některý nebo počkejte, až vyprší."
COM_FGLOGINASUSER_CONFIG_MAXPENDING_LABEL="Maximum nepoužitých přihlašovacích odkazů na administrátora"
COM_FGLOGINASUSER_CONFIG_MAXPENDING_DESC="Přihlášení do frontendu, která byla zahájena, ale ještě nebyla otevřena. Další pokusy jsou odepřeny, dokud nebude některé použito nebo nevyprší."
COM_FGLOGINASUSER_CONFIGURATION="FG Login as User: Volby"
COM_FGLOGINASUSER_ERR_HIGHER="Tento uživatel má globální oprávnění, která nemáte."
COM_FGLOGINASUSER_CONFIG_HIGHER_LABEL="Nepovolit přihlášení jako uživatelé s vyššími právy"
COM_FGLOGINASUSER_CONFIG_HIGHER_DESC="Administrátor se nemůže přihlásit jako uživatel, který má globální oprávnění (Přístup do administrace, Vytvořit, Smazat, Upravit, Upravit stav, Upravit vlastní), jež administrátorovi chybí, jinak by kdokoli s oprávněním k přihlášení mohl převzít silnější účty. Super uživatelé tímto pravidlem omezeni nejsou. Oprávnění uvnitř jednotlivých komponent se neporovnávají; k nim použijte omezení podle skupin níže."
COM_FGLOGINASUSER_CONFIG_SCOPE_NOTE_LABEL="Jako koho se lze přihlásit?"
COM_FGLOGINASUSER_CONFIG_SCOPE_NOTE_DESC="Udělení oprávnění k přihlášení skupině neomezuje, jako které uživatele se její členové mohou přihlásit. K tomu použijte volbu níže a omezení podle skupin."
COM_FGLOGINASUSER_ERR_STEPUP_MFA_UNAVAILABLE="Druhý faktor vašeho účtu se nepodařilo ověřit, proto bylo přihlášení odepřeno. Zkuste to znovu nebo se obraťte na správce webu."
COM_FGLOGINASUSER_ERR_STEPUP_MFA_UNSUPPORTED="Váš druhý faktor se zde vyžádat nedá, proto bylo přihlášení odepřeno."
COM_FGLOGINASUSER_CONFIG_STEPUP_UNSUP_LABEL="Účty, jejichž druhý faktor se zde vyžádat nedá"
