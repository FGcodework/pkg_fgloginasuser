COM_FGLOGINASUSER_CONFIG_GENERAL_DESC="Schaltflächentexte und Weiterleitungen."
COM_FGLOGINASUSER_CONFIG_BTN_SITE_LABEL="Text der Frontend-Schaltfläche"
COM_FGLOGINASUSER_CONFIG_BTN_SITE_DESC="Text der Schaltfläche für die Frontend-Anmeldung. %s wird durch den Benutzernamen ersetzt. Leer lassen für den Standardtext."
COM_FGLOGINASUSER_CONFIG_BTN_ADMIN_LABEL="Text der Backend-Schaltfläche"
COM_FGLOGINASUSER_CONFIG_BTN_ADMIN_DESC="Text der Schaltfläche für die Backend-Anmeldung. %s wird durch den Benutzernamen ersetzt. Leer lassen für den Standardtext."
COM_FGLOGINASUSER_CONFIG_NEWTAB_LABEL="Frontend in neuem Tab öffnen"
COM_FGLOGINASUSER_CONFIG_NEWTAB_DESC="Die Frontend-Sitzung ist von der Backend-Sitzung getrennt, daher bleibt Ihre Administrationsansicht in einem neuen Tab geöffnet. Die Backend-Anmeldung erfolgt immer im aktuellen Tab, da sie genau diese Sitzung umstellt."
COM_FGLOGINASUSER_CONFIG_SITE_MENUITEM_LABEL="Frontend-Weiterleitung: Menüeintrag"
COM_FGLOGINASUSER_CONFIG_SITE_MENUITEM_DESC="Menüeintrag, der nach der Frontend-Anmeldung angezeigt wird. Hat Vorrang vor der URL unten."
COM_FGLOGINASUSER_CONFIG_SITE_URL_LABEL="Frontend-Weiterleitung: URL"
COM_FGLOGINASUSER_CONFIG_SITE_URL_DESC="Interne URL, die nach der Frontend-Anmeldung angezeigt wird, wenn kein Menüeintrag gesetzt ist. Leer bedeutet Startseite."
COM_FGLOGINASUSER_CONFIG_ADMIN_URL_LABEL="Backend-Weiterleitung: URL"
COM_FGLOGINASUSER_CONFIG_ADMIN_URL_DESC="Administrations-URL (zum Beispiel index.php?option=com_content), die nach dem Umstellen der Backend-Sitzung angezeigt wird. Leer bedeutet das Dashboard."
COM_FGLOGINASUSER_CONFIG_CSS_LABEL="Eigenes CSS für die Schaltflächen"
COM_FGLOGINASUSER_CONFIG_CSS_DESC="CSS, das auf der Benutzerseite angewendet wird, zum Beispiel .fg-las-btn { font-weight: bold; }"
COM_FGLOGINASUSER_CONFIG_SECURITY="Sicherheit"
COM_FGLOGINASUSER_CONFIG_SECURITY_DESC="Als wer man sich anmelden kann und wie lange ein Anmeldelink gültig bleibt."
COM_FGLOGINASUSER_CONFIG_TTL_LABEL="Gültigkeit des Anmeldelinks (Sekunden)"
COM_FGLOGINASUSER_CONFIG_TTL_DESC="Der einmalige Frontend-Anmeldelink funktioniert nach dieser Zeit und nach der ersten Verwendung nicht mehr."
COM_FGLOGINASUSER_CONFIG_BINDIP_LABEL="Anmeldelink an IP-Adresse binden"
COM_FGLOGINASUSER_CONFIG_BINDIP_DESC="Die Frontend-Anmeldung funktioniert nur von der IP-Adresse, die sie erstellt hat. Ausschalten, wenn Ihre Verbindung zwischen IPv4 und IPv6 wechselt."
COM_FGLOGINASUSER_CONFIG_SUPERUSERS_LABEL="Anmeldung als Super-Benutzer erlauben"
COM_FGLOGINASUSER_CONFIG_SUPERUSERS_DESC="Standardmäßig aus. Wenn aktiviert, darf sich ein Super-Benutzer als anderer Super-Benutzer anmelden."
COM_FGLOGINASUSER_CONFIG_RESTRICTIONS_LABEL="Beschränkungen je Administratorgruppe"
COM_FGLOGINASUSER_CONFIG_RESTRICTIONS_DESC="Legen Sie fest, als welche Benutzer sich Mitglieder einer Gruppe anmelden dürfen. Administratoren, deren Gruppen hier keine Zeile haben, sind nicht beschränkt; eine Zeile ohne Zielgruppen erlaubt niemanden. Gelten für einen Administrator mehrere Zeilen (eigene und geerbte Gruppen), werden ihre Zielgruppen vereinigt. Super-Benutzer sind nie beschränkt."
COM_FGLOGINASUSER_CONFIG_RESTR_ACTOR="Administratorgruppe"
COM_FGLOGINASUSER_CONFIG_RESTR_TARGETS="Darf sich anmelden als Mitglieder von"
COM_FGLOGINASUSER_CONFIG_LOGGING="Protokoll und Benachrichtigungen"
COM_FGLOGINASUSER_CONFIG_LOGGING_DESC="Aufbewahrung des Audit-Protokolls und E-Mail-Benachrichtigungen."
COM_FGLOGINASUSER_CONFIG_RETENTION_LABEL="Protokolleinträge aufbewahren (Tage)"
COM_FGLOGINASUSER_CONFIG_RETENTION_DESC="Ältere Einträge werden automatisch entfernt. 0 behält sie für immer."
COM_FGLOGINASUSER_CONFIG_NOTIFY_LABEL="E-Mail-Benachrichtigung"
COM_FGLOGINASUSER_CONFIG_NOTIFY_DESC="Sendet jedes Mal eine E-Mail, wenn sich jemand als anderer Benutzer anmeldet. Verwendet die Mail-Einstellungen von Joomla (SMTP funktioniert auch bei Hostern ohne PHP-mail)."
COM_FGLOGINASUSER_CONFIG_NOTIFY_EMAIL_LABEL="E-Mail-Adresse für Benachrichtigungen"
COM_FGLOGINASUSER_CONFIG_NOTIFY_EMAIL_DESC="Leer lassen, um die Absenderadresse aus der Globalen Konfiguration zu verwenden."
COM_FGLOGINASUSER_ERR_SHARED_SESSION="Die Website verwendet eine gemeinsame Sitzung für Frontend und Administration (Globale Konfiguration -> System -> Gemeinsame Sitzung). Die Anmeldung als anderer Benutzer ist bei gemeinsamen Sitzungen deaktiviert, da die fremde Identität auch für Ihre eigene Administration gelten würde."
COM_FGLOGINASUSER_ERR_NO_BAR="Das Plugin System - FG Login as User ist deaktiviert. Es zeigt die Leiste, mit der Sie zu Ihrem eigenen Konto zurückkehren, daher ist die Anmeldung als anderer Benutzer gesperrt, bis es aktiviert wird."
COM_FGLOGINASUSER_ERR_RESET="Dieser Benutzer muss bei der nächsten Anmeldung das Passwort ändern. Joomla würde die Sitzung zum Passwortformular schicken und den Rückweg blockieren, daher ist die Anmeldung als dieser Benutzer nicht möglich."
COM_FGLOGINASUSER_ERR_SESSION="Die Sitzung konnte nicht erneuert werden, daher wurde nichts geändert."
COM_FGLOGINASUSER_ERR_TOKEN_IP="Token von einer anderen IP-Adresse verwendet: %s"
COM_FGLOGINASUSER_NOTE_REPLACED="Durch eine neue Anmeldung als anderer Benutzer in derselben Browsersitzung ersetzt."
COM_FGLOGINASUSER_LOGS_PURGE_CONFIRM="Abgeschlossene Protokolleinträge löschen? Unbenutzte Anmeldelinks, die noch nicht abgelaufen sind, und Anmeldungen des letzten Tages bleiben erhalten."
COM_FGLOGINASUSER_ACTION_LOGS="Audit-Protokoll anzeigen und löschen"
COM_FGLOGINASUSER_ACTION_LOGS_DESC="Erlaubt das Öffnen des Audit-Protokolls dieser Komponente (IP-Adressen, wer sich als wer angemeldet hat) und das Löschen seiner Einträge. Für die Anmelde-Schaltflächen ist es nicht erforderlich."
COM_FGLOGINASUSER_CONFIG_RESTR_DEFAULT_LABEL="Administratoren ohne Beschränkung"
COM_FGLOGINASUSER_CONFIG_RESTR_DEFAULT_DESC="Was passiert, wenn für den Administrator keine der Beschränkungen unten gilt (einschließlich von übergeordneten Gruppen geerbter Gruppen). Erlauben = jedes Ziel, das er sonst verwenden darf; Verweigern = niemand, daher braucht jede Administratorgruppe eine Zeile. Super-Benutzer sind nie beschränkt."
COM_FGLOGINASUSER_CONFIG_RESTR_DEFAULT_ALLOW="Erlauben"
COM_FGLOGINASUSER_CONFIG_RESTR_DEFAULT_DENY="Verweigern"
COM_FGLOGINASUSER_DIALOG_TITLE_SITE="Im Frontend als %s anmelden"
COM_FGLOGINASUSER_DIALOG_BODY_SITE="Die Website öffnet sich in einem neuen Tab mit der Sitzung dieses Benutzers. Mit der Leiste am unteren Seitenrand beenden Sie sie."
COM_FGLOGINASUSER_DIALOG_OK_SITE="Im Frontend anmelden"
