COM_FGLOGINASUSER_CONFIG_RESTR_MINUTES="Max. Minuten"
COM_FGLOGINASUSER_CONFIG_RESTR_MINUTES_DESC="Höchstdauer einer von dieser Gruppe gestarteten Anmeldung. Es gilt der kürzeste Wert aus diesem und der allgemeinen Höchstdauer (und aus weiteren Zeilen, die für dieselbe Person gelten). Leer oder 0 = diese Zeile setzt keine Grenze."
